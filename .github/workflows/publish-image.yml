name: Publish agent image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/guibersi7/mac-nurse:v1
          labels: |
            org.opencontainers.image.source=https://github.com/guibersi7/mac-nurse
            org.opencontainers.image.licenses=MIT
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/guibersi7/mac-nurse@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
